<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tip Calculator</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --muted: #8b98a5;
      --text: #f4f7fa;
      --accent: #3dd6c6;
      --accent-dim: #2aa89b;
      --input: #24303c;
      --border: #334155;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1c3d3a 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 10%, #24344a 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel {
      padding: 28px;
    }

    .inputs {
      background: linear-gradient(180deg, rgba(61, 214, 198, 0.05), transparent 40%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 0 0 28px;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #c5d0da;
    }

    .field {
      margin-bottom: 22px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 14px 14px 34px;
      font-size: 1.05rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 198, 0.18);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .presets button {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 0;
      cursor: pointer;
      font-weight: 650;
    }

    .presets button.active,
    .presets button:hover {
      background: var(--accent);
      color: #062824;
      border-color: var(--accent);
    }

    .results {
      background: #121920;
      display: grid;
      gap: 8px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #263241;
    }

    .result-row:last-child {
      border-bottom: 0;
    }

    .result-row span {
      color: var(--muted);
    }

    .result-row strong {
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      letter-spacing: -0.03em;
      text-align: right;
      white-space: nowrap;
    }

    .per-person {
      background: rgba(61, 214, 198, 0.1);
      border: 1px solid rgba(61, 214, 198, 0.25);
      border-radius: 16px;
      padding: 18px 16px;
    }

    .per-person strong {
      color: var(--accent);
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .results .result-row:nth-child(1),
    .results .result-row:nth-child(2) {
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel inputs">
      <h1>Tip calculator</h1>
      <p class="lede">Split a bill with a clean tip and per-person total.</p>

      <div class="field">
        <label for="bill">Bill amount</label>
        <div class="input-wrap">
          <span>$</span>
          <input id="bill" type="number" min="0" step="0.01" value="86.40" />
        </div>
      </div>

      <div class="field">
        <label for="tip">Tip percent</label>
        <div class="presets" id="presets">
          <button type="button" data-tip="15">15%</button>
          <button type="button" data-tip="18" class="active">18%</button>
          <button type="button" data-tip="20">20%</button>
          <button type="button" data-tip="25">25%</button>
        </div>
        <div class="input-wrap">
          <span>%</span>
          <input id="tip" type="number" min="0" step="0.1" value="18" />
        </div>
      </div>

      <div class="field">
        <label for="people">Number of people</label>
        <div class="input-wrap">
          <span>#</span>
          <input id="people" type="number" min="1" step="1" value="3" />
        </div>
        <p class="hint">Use 1 if you’re paying the whole check.</p>
      </div>
    </section>

    <section class="panel results">
      <div class="result-row">
        <span>Tip</span>
        <strong id="tipAmount" aria-live="polite">$0.00</strong>
      </div>
      <div class="result-row">
        <span>Total</span>
        <strong id="total" aria-live="polite">$0.00</strong>
      </div>
      <div class="result-row per-person">
        <span>Per person</span>
        <strong id="perPerson" aria-live="polite">$0.00</strong>
      </div>
    </section>
  </main>

  <script>
    const billInput = document.getElementById("bill");
    const tipInput = document.getElementById("tip");
    const peopleInput = document.getElementById("people");
    const tipAmountEl = document.getElementById("tipAmount");
    const totalEl = document.getElementById("total");
    const perPersonEl = document.getElementById("perPerson");
    const presetButtons = [...document.querySelectorAll("#presets button")];

    const money = (n) =>
      Number.isFinite(n)
        ? n.toLocaleString("en-US", { style: "currency", currency: "USD" })
        : "$0.00";

    function calculate() {
      const bill = Math.max(0, Number(billInput.value) || 0);
      const tipPct = Math.max(0, Number(tipInput.value) || 0);
      const people = Math.max(1, Math.floor(Number(peopleInput.value) || 1));

      const tip = bill * (tipPct / 100);
      const total = bill + tip;
      const perPerson = total / people;

      tipAmountEl.textContent = money(tip);
      totalEl.textContent = money(total);
      perPersonEl.textContent = money(perPerson);
    }

    function syncPreset() {
      const current = String(Number(tipInput.value));
      presetButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tip === current);
      });
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        tipInput.value = btn.dataset.tip;
        syncPreset();
        calculate();
      });
    });

    [billInput, tipInput, peopleInput].forEach((input) => {
      input.addEventListener("input", () => {
        if (input === tipInput) syncPreset();
        calculate();
      });
    });

    calculate();
  </script>
</body>
</html>
